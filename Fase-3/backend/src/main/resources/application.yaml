spring:
  config:
    import: "optional:file:.env[.properties],optional:file:./Fase-3/backend/.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

ferreteria:
  app:
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: 86400000

server:
  port: 8080