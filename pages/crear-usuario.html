<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración para diseño responsive exigida en la rúbrica -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tienda.css">
</head>
<body>
    <!-- Cabecera y Menú de navegación -->
    <header>
        <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../img/logo.png" alt="Logo Ferretería Los Maestros" class="logo-img">
                    <span class="texto-ferreteria">Ferretería</span>
                    <span class="texto-maestros">Los Maestros</span>
                </a>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="principal.html">
                            <i class="bi bi-house-door-fill"></i>
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="gestion-productos.html">
                            <i class="bi bi-box-seam"></i>
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="inventario.html">
                            <i class="bi bi-card-checklist"></i>
                            Inventario
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-receipt"></i>
                            Pedidos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-person"></i>
                            Usuarios
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-file-bar-graph"></i>
                            Reportes
                        </a>
                    </li>
                </ul>

            </div>
        </nav>
    
    </header>

    <!-- Contenedor principal para el contenido de cada página -->
    <main>
        <div class="my-2 mx-2">
            <a href="gestion-usuarios.html" class="btn" style="background-color: var(--color-accent); color: var(--color-header);">← Volver</a>
        </div>

        <section>
            <div class="card mt-5 border-0 shadow-sm rounded-4 p-4 mx-auto" style="border: 1px solid #e2e8f0 !important; max-width: 600px;">
                <form id="form-nuevo-usuario">
                    <div class="row g-4">
            
            <!-- Nombre completo -->
                        <div class="col-12">
                            <label for="nombre-usuario" class="form-label fw-medium text-dark">Nombre completo *</label>
                            <input type="text" class="form-control shadow-none rounded-3" id="nombre-usuario" required>
                        </div>
            
            <!-- Correo -->
                        <div class="col-12">
                            <label for="correo-usuario" class="form-label fw-medium text-dark">Correo *</label>
                            <input type="email" class="form-control shadow-none rounded-3" id="correo-usuario" required>
                        </div>
            
            <!-- Contraseña -->
                        <div class="col-12">
                            <label for="password-usuario" class="form-label fw-medium text-dark">Contraseña *</label>
                            <input type="password" class="form-control shadow-none rounded-3" id="password-usuario" required>
                        </div>
            
            <!-- Confirmar contraseña -->
                        <div class="col-12">
                            <label for="confirmar-password" class="form-label fw-medium text-dark">Confirmar contraseña *</label>
                            <input type="password" class="form-control shadow-none rounded-3" id="confirmar-password" required>
                        </div>
            
            <!-- Rol -->
                        <div class="col-12">
                            <label for="rol-usuario" class="form-label fw-medium text-dark">Rol *</label>
                            <select class="form-select shadow-none rounded-3" id="rol-usuario" required>
                                <option value="Cliente" selected>Cliente</option>
                                <option value="Vendedor">Vendedor</option>
                                <option value="Administrador">Administrador</option>
                            </select>
                        </div>
            
            <!-- Botones de acción -->
                        <div class="col-12 mt-4 pt-2">
                            <div class="row g-3">
                    <!-- Botón Cancelar -->
                                <div class="col-6">
                                    <button type="button" class="btn btn-outline-secondary w-100 py-2 rounded-3 fw-medium" onclick="window.history.back()">
                                        Cancelar
                                    </button>
                                </div>
                    
                    <!-- Botón Crear usuario -->
                                <div class="col-6">
                                    <button type="submit" class="btn w-100 py-2 rounded-3 fw-medium text-white shadow-sm" style="background-color: #d97706;">
                                        Crear usuario
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </form>
            </div>
        </section>
        
    </main>

    <!-- Pie de página informativo -->
    <footer>
        <p>&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </footer>

    <!-- Vinculación del script principal vacío -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/main.js"></script>
    <script src="../js/tienda.js"></script>

</body>
</html>
