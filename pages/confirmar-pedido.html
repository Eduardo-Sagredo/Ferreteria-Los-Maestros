<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar Pedido | Ferretería Los Maestros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tienda.css">
</head>

<body>

    <header>
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container">

            <a class="navbar-brand" href="../index.html">
                <img src="../img/logo.png" alt="Logo Ferretería Los Maestros" class="logo-img">
                <span class="texto-ferreteria">Ferretería</span>
                <span class="texto-maestros">Los Maestros</span>
            </a>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="../index.html">
                        <i class="bi bi-house-door-fill"></i>
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="productos.html">
                        <i class="bi bi-box-seam"></i>
                        Productos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="../index.html#sobre-nosotros">
                        <i class="bi bi-people"></i>
                        Sobre nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-receipt"></i>
                            Mis pedidos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-clock-history"></i>
                            Historial
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-wallet2"></i>
                        Cuenta corriente
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-geo-alt"></i>
                        Ubicación
                        </a>
                    </li>

                </ul>

            </div>
        </nav>
    </header>

    <main class="container my-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">Confirmar Pedido</h2>

                        <form id="formPedido" novalidate>

                            <!-- Tipo de entrega -->
                            <div class="mb-4">

                                <label class="form-label fw-bold">
                                    Seleccione el tipo de entrega
                                </label>

                                <div class="form-check mb-2">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="tipoEntrega"
                                        id="retiro"
                                        value="retiro">

                                    <label class="form-check-label" for="retiro">
                                        Retiro en tienda
                                    </label>

                                </div>

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="tipoEntrega"
                                        id="despacho"
                                        value="despacho">

                                    <label class="form-check-label" for="despacho">
                                        Despacho a domicilio
                                    </label>

                                </div>

                                <div id="errorEntrega" class="text-danger mt-2"></div>

                            </div>


                            <!-- Dirección -->
                            <div class="mb-3 d-none" id="contenedorDireccion">

                                <label for="direccion" class="form-label">
                                    Dirección de despacho
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="direccion"
                                    name="direccion"
                                    placeholder="Ingrese la dirección de despacho">

                                <div id="errorDireccion" class="text-danger mt-1"></div>

                            </div>


                            <!-- Resumen -->
                            <div class="card bg-light mb-4">

                                <div class="card-body">

                                    <h5>Resumen del pedido</h5>

                                    <p class="mb-1">
                                        <strong>Productos:</strong> 3
                                    </p>

                                    <p class="mb-0">
                                        <strong>Total:</strong> $75.990
                                    </p>

                                </div>

                            </div>


                            <!-- Botón -->
                            <div class="d-grid">

                                <button type="submit" class="btn btn-dark">
                                    Confirmar pedido
                                </button>

                            </div>


                            <div
                                id="mensajeExito"
                                class="text-success text-center mt-3">
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Pie de página informativo -->
    <footer>
        <p>&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="../js/confirmar-pedido.js"></script>

</body>

</html>
