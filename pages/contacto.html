<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Ferretería Los Maestros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tienda.css">
</head>

<body>

    <header>
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container">

            <a class="navbar-brand" href="../index.html">
                <img src="../img/logo.png" alt="Logo Ferretería Los Maestros" class="logo-img">
                <span class="texto-ferreteria">Ferretería</span>
                <span class="texto-maestros">Los Maestros</span>
            </a>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="../index.html">
                        <i class="bi bi-house-door-fill"></i>
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="productos.html">
                        <i class="bi bi-box-seam"></i>
                        Productos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="../index.html#sobre-nosotros">
                        <i class="bi bi-people"></i>
                        Sobre nosotros
                        </a>
                    </li>

                    <a class="nav-link" href="mis-pedidos.html">
                        <i class="bi bi-receipt"></i>
                            Mis pedidos
                    </a>

                    <a class="nav-link" href="historial.html">
                        <i class="bi bi-clock-history"></i>
                            Historial
                    </a>

                    <a class="nav-link" href="cuenta-corriente.html">
                        <i class="bi bi-wallet2"></i>
                            Cuenta corriente
                    </a>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-geo-alt"></i>
                        Ubicación
                        </a>
                    </li>

                </ul>

            </div>
        </nav>
    </header>

    <main class="container my-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">Contacto</h2>

                        <form id="formContacto" novalidate>

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    Nombre
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    name="nombre"
                                    placeholder="Ingrese su nombre">

                                <div id="errorNombre" class="text-danger mt-1"></div>
                            </div>

                            <!-- Correo -->
                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    placeholder="ejemplo@duoc.cl">

                                <div id="errorCorreo" class="text-danger mt-1"></div>
                            </div>

                            <!-- Comentario -->
                            <div class="mb-3">
                                <label for="comentario" class="form-label">
                                    Comentario
                                </label>

                                <textarea
                                    class="form-control"
                                    id="comentario"
                                    name="comentario"
                                    rows="5"
                                    placeholder="Escriba su comentario"></textarea>

                                <div id="errorComentario" class="text-danger mt-1"></div>
                            </div>

                            <!-- Botón -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark">
                                    Enviar mensaje
                                </button>
                            </div>

                            <div id="mensajeExito" class="text-success text-center mt-3"></div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Pie de página informativo -->
    <footer>
        <p>&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="../js/contacto.js"></script>

</body>

</html>
