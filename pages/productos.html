<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Ferretería Los Maestros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tienda.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../img/logo.png" alt="Logo Ferretería Los Maestros" class="logo-img">
                    <span class="texto-ferreteria">Ferretería</span>
                    <span class="texto-maestros">Los Maestros</span>
                </a>

                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="../index.html"><i class="bi bi-house-door-fill"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html"><i class="bi bi-box-seam"></i> Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrito.html"><i class="bi bi-cart3"></i> Carrito <span id="contadorCarrito" class="badge text-bg-warning">0</span></a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="catalogo-section py-5">
        <div class="container">
            <div class="text-center mb-4">
                <p class="seccion-etiqueta">FERRETERÍA LOS MAESTROS</p>
                <h1>Catálogo de productos</h1>
                <p class="text-secondary">Busca por nombre o entra directamente a una categoría.</p>
            </div>

            <div class="row mb-4">
                <div class="col-12 col-md-8 col-lg-6 mx-auto">
                    <label for="buscarProducto" class="form-label visually-hidden">Buscar producto</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="buscarProducto" class="form-control" placeholder="Buscar producto...">
                    </div>
                </div>
            </div>

            <div class="filtros-catalogo d-flex flex-wrap justify-content-center gap-2 mb-4">
                <a href="productos.html" class="btn btn-outline-dark">Todos</a>
                <a href="productos.html?categoria=herramientas" class="btn btn-outline-dark">Herramientas</a>
                <a href="productos.html?categoria=construccion" class="btn btn-outline-dark">Construcción</a>
                <a href="productos.html?categoria=electricidad" class="btn btn-outline-dark">Electricidad</a>
                <a href="productos.html?categoria=pinturas" class="btn btn-outline-dark">Pinturas</a>
            </div>

            <div id="mensajeTienda" class="d-none" role="alert"></div>

            <div id="listaProductos" class="row g-4">
                <!-- JavaScript crea aquí los productos -->
            </div>
        </div>
    </main>

    <footer class="footer-tienda">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/tienda.js"></script>
</body>
</html>
