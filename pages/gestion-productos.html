<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración para diseño responsive exigida en la rúbrica -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/tienda.css">
</head>
<body>
    <!-- Cabecera y Menú de navegación -->
    <header>
        <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../img/logo.png" alt="Logo Ferretería Los Maestros" class="logo-img">
                    <span class="texto-ferreteria">Ferretería</span>
                    <span class="texto-maestros">Los Maestros</span>
                </a>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="principal.html">
                            <i class="bi bi-house-door-fill"></i>
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pages/productos.html">
                            <i class="bi bi-box-seam"></i>
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#sobre-nosotros">
                            <i class="bi bi-card-checklist"></i>
                            Inventario
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-receipt"></i>
                            Pedidos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-person"></i>
                            Usuarios
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-file-bar-graph"></i>
                            Reportes
                        </a>
                    </li>
                </ul>

            </div>
        </nav>
    
    </header>

    <!-- Contenedor principal para el contenido de cada página -->
    <main>
        <!-- Titulo y botón agregar -->
        <section>
            <div class="d-flex justify-content-between mx-2 my-2">
                <h1 class="fs-2">Gestión de productos</h1>
                <a href="agregar-producto.html" class="btn d-inline-flex align-items-center" style="background-color: var(--color-accent); color: var(--color-header);">
                    + Agregar Producto
                </a>
            </div>
            
        </section>

        <section>
            <div class="container my-5">

            
            <!-- Barra de Búsqueda y Filtros -->
            <div class="row g-3 mb-4">
    <!-- Buscador de texto -->
                <div class="col-md-12 col-lg-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-3 text-secondary">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="input-busqueda" class="form-control border-start-0 rounded-end-3 shadow-none" placeholder="Buscar...">
                    </div>
                </div>

    <!-- Filtro de Categorías -->
                <div class="col-md-6 col-lg-3">
                    <select id="filtro-categoria" class="form-select rounded-3 shadow-none text-secondary">
                        <option value="todas" selected>Todas las categorías</option>
                        <option value="Herramientas">Herramientas</option>
                        <option value="Eléctricas">Eléctricas</option>
                        <option value="Construcción">Construcción</option>
                        <option value="Gásfitería">Gásfitería</option>
                    </select>
                </div>

    <!-- Filtro de Estados -->
                <div class="col-md-6 col-lg-3">
                    <select id="filtro-estado" class="form-select rounded-3 shadow-none text-secondary">
                        <option value="todos" selected>Todos los estados</option>
                        <option value="Disponible">Disponible</option>
                        <option value="Stock bajo">Stock bajo</option>
                        <option value="Sin stock">Sin stock</option>
                    </select>
                </div>

            </div>
            </div>

        </section>

        <section>
            <div class="container">
            <div class="table-responsive bg-white rounded-3 shadow-sm border" style="border-color: var(--color-header)!important;">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light text-secondary" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                        <tr>
                            <th class="py-3 px-4 fw-medium border-bottom-0">CÓDIGO</th>
                            <th class="py-3 fw-medium border-bottom-0">PRODUCTO</th>
                            <th class="py-3 fw-medium border-bottom-0">CATEGORÍA</th>
                            <th class="py-3 fw-medium border-bottom-0">PRECIO</th>
                            <th class="py-3 text-center fw-medium border-bottom-0">STOCK</th>
                            <th class="py-3 text-center fw-medium border-bottom-0">MÍN.</th>
                            <th class="py-3 text-center fw-medium border-bottom-0">ESTADO</th>
                            <th class="py-3 text-center fw-medium border-bottom-0">ACCIONES</th>
                        </tr>
                    </thead>
        
                    <tbody id="tbody-productos" class="border-top-0">
                    </tbody>
        
                </table>
            </div>
            </div>
        </section>


    </main>

    <!-- Pie de página informativo -->
    <footer>
        <p>&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </footer>

    <!-- Vinculación del script principal vacío -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/main.js"></script>
    <script src="../js/tienda.js"></script>

</body>
</html>
